<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Installation Guide | Panduan Instalasi Python</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-button {
            transition: all 0.3s ease;
        }
        .tab-button.active {
            background-color: #3B82F6;
            color: white;
        }
        .language-toggle {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .language-toggle.active {
            border-bottom: 3px solid #3B82F6;
            font-weight: bold;
        }
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .copy-btn {
            transition: all 0.3s ease;
        }
        .copy-btn:hover {
            background-color: #3B82F6;
            color: white;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Python Installation Guide</h1>
            <h1 class="text-4xl font-bold text-gray-800">Panduan Instalasi Python</h1>
            <div class="flex justify-center mt-4">
                <img src="https://www.python.org/static/img/python-logo.png" alt="Python Logo" class="h-24">
            </div>
        </header>

        <!-- Language Toggle -->
        <div class="flex justify-center mb-8">
            <div class="flex bg-gray-200 rounded-lg p-1">
                <span class="language-toggle active px-4 py-2 rounded-lg" onclick="toggleLanguage('en')">English</span>
                <span class="language-toggle px-4 py-2 rounded-lg" onclick="toggleLanguage('id')">Bahasa Indonesia</span>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex flex-wrap justify-center mb-6 gap-2">
            <button class="tab-button active px-4 py-2 rounded-lg bg-blue-100" onclick="showTab('windows')">Windows</button>
            <button class="tab-button px-4 py-2 rounded-lg bg-blue-100" onclick="showTab('linux')">Linux</button>
            <button class="tab-button px-4 py-2 rounded-lg bg-blue-100" onclick="showTab('macos')">macOS</button>
        </div>

        <!-- Content Sections -->
        <div class="space-y-8">
            <!-- Windows Section -->
            <div id="windows-tab" class="tab-content">
                <div class="card bg-white p-6 rounded-lg shadow-md">
                    <h2 id="windows-title" class="text-2xl font-bold text-gray-800 mb-4">Python Installation on Windows</h2>
                    <div id="windows-steps" class="space-y-4">
                        <!-- Steps will be loaded dynamically -->
                    </div>
                    <div class="mt-6 bg-gray-800 p-4 rounded-lg">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-gray-300 text-sm">Download Link</span>
                            <button class="copy-btn text-xs bg-gray-700 text-white px-3 py-1 rounded" onclick="copyToClipboard('win-download-link')">Copy</button>
                        </div>
                        <code id="win-download-link" class="text-green-400 block overflow-x-auto">
                            https://www.python.org/downloads/windows/
                        </code>
                    </div>
                </div>
            </div>

            <!-- Linux Section -->
            <div id="linux-tab" class="tab-content hidden">
                <div class="card bg-white p-6 rounded-lg shadow-md">
                    <h2 id="linux-title" class="text-2xl font-bold text-gray-800 mb-4">Python Installation on Linux</h2>
                    <div id="linux-steps" class="space-y-4">
                        <!-- Steps will be loaded dynamically -->
                    </div>
                </div>
            </div>

            <!-- macOS Section -->
            <div id="macos-tab" class="tab-content hidden">
                <div class="card bg-white p-6 rounded-lg shadow-md">
                    <h2 id="macos-title" class="text-2xl font-bold text-gray-800 mb-4">Python Installation on macOS</h2>
                    <div id="macos-steps" class="space-y-4">
                        <!-- Steps will be loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Current language (default: English)
        let currentLanguage = 'en';
        
        // Function to toggle between languages
        function toggleLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.language-toggle').forEach(el => {
                el.classList.toggle('active', el.textContent === (lang === 'en' ? 'English' : 'Bahasa Indonesia'));
            });
            loadGuide(currentTab, lang);
        }

        // Current active tab
        let currentTab = 'windows';

        // Function to show selected tab
        function showTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.toggle('hidden', el.id !== `${tabName}-tab`);
            });
            document.querySelectorAll('.tab-button').forEach((btn, index) => {
                btn.classList.toggle('active', index === ['windows', 'linux', 'macos'].indexOf(tabName));
            });
            loadGuide(tabName, currentLanguage);
        }

        // Function to load guide from backend
        async function loadGuide(osType, lang) {
            try {
                const response = await fetch(`/api/guides/${osType}?lang=${lang}`);
                const data = await response.json();
                
                // Update title
                document.getElementById(`${osType}-title`).textContent = data.title;
                
                // Update steps
                const stepsContainer = document.getElementById(`${osType}-steps`);
                stepsContainer.innerHTML = '';
                
                data.steps.forEach((step, index) => {
                    const stepDiv = document.createElement('div');
                    stepDiv.className = 'flex items-start';
                    
                    const numberSpan = document.createElement('span');
                    numberSpan.className = 'flex-shrink-0 bg-blue-500 text-white rounded-full w-6 h-6 flex items-center justify-center mr-3 mt-1';
                    numberSpan.textContent = index + 1;
                    
                    const contentDiv = document.createElement('div');
                    
                    const titleH3 = document.createElement('h3');
                    titleH3.className = 'font-semibold';
                    titleH3.textContent = step.title;
                    
                    contentDiv.appendChild(titleH3);
                    
                    if (step.content) {
                        const contentP = document.createElement('p');
                        contentP.className = 'text-gray-700';
                        contentP.textContent = step.content;
                        contentDiv.appendChild(contentP);
                    }
                    
                    if (step.command) {
                        const commandDiv = document.createElement('div');
                        commandDiv.className = 'bg-gray-800 p-3 rounded-lg mt-2';
                        
                        const commandCode = document.createElement('code');
                        commandCode.className = 'text-green-400';
                        commandCode.textContent = step.command;
                        
                        commandDiv.appendChild(commandCode);
                        contentDiv.appendChild(commandDiv);
                    }
                    
                    stepDiv.appendChild(numberSpan);
                    stepDiv.appendChild(contentDiv);
                    stepsContainer.appendChild(stepDiv);
                });
            } catch (error) {
                console.error('Error loading guide:', error);
            }
        }

        // Function to copy text to clipboard
        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent.trim();
            
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            loadGuide('windows', 'en');
        });
    </script>
</body>
</html>
